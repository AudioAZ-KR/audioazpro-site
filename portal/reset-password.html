<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/favicon.png"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>새 비밀번호 설정 — AudioAZ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
@font-face{font-family:'NanumSquareRound';src:url('fonts/NanumSquareRoundEB.woff2') format('woff2');font-weight:800;font-display:swap}
h1{font-family:'NanumSquareRound','Pretendard',sans-serif}
:root{--blue:#1877F2;--blue-deep:#0E5FCC;--blue-soft:#4D96F5;--page:#0B1220;--card:#121D33;--bg:#0C1424;--line:#243350;--text:#E9EEF7;--dim:#96A6BF}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}img{max-width:100%}
.topbar{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;padding:0 24px}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:88px 20px 40px}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 30px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em;text-align:center}
.sub{text-align:center;color:var(--dim);font-size:14px;margin:6px 0 22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--dim);margin-bottom:5px}
.field input{width:100%;height:48px;border:1px solid var(--line);border-radius:11px;padding:0 14px;font-family:inherit;font-size:15px;color:var(--text);background:#0E1A2E}
.field input::placeholder{color:#6B7C96}
.field input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,119,242,.18)}
.field .hint{font-size:11.5px;color:var(--dim);margin-top:4px}
.err{color:#ff9ea3;font-size:12.5px;margin:-6px 0 10px;display:none}.err.on{display:block}
.primary{width:100%;height:48px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-family:inherit;font-size:15.5px;font-weight:800;cursor:pointer;transition:.15s}
.primary:hover{background:var(--blue-deep)}
.ok{display:none;text-align:center}
.ok.on{display:block}.form.off{display:none}
.ok .check{width:56px;height:56px;border-radius:50%;background:#12351f;border:1px solid #1f5c37;color:#7ee0a6;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px}
.ok p{color:var(--dim);font-size:14px;margin-bottom:18px}
.note{font-size:12px;color:var(--dim);margin-top:14px;line-height:1.6;text-align:center}
.demobar{position:fixed;top:0;left:0;right:0;z-index:300;background:#8a5a00;color:#ffe0ad;text-align:center;font-size:12px;font-weight:600;padding:7px 12px}</style>
</head>
<body>
<div class="topbar"><a href="/" class="logo" aria-label="AudioAZ 홈"><img src="/assets/logo-lockup-white.png" alt="AudioAZ" style="height:28px;width:auto;display:block"></a></div>
<div class="wrap">
  <div class="card">
    <div class="form" id="form">
      <h1>새 비밀번호 설정</h1>
      <p class="sub">새로 사용할 비밀번호를 입력하세요.</p>
      <form onsubmit="return resetPw(event)">
        <div class="field">
          <label>새 비밀번호</label>
          <input type="password" name="pw" placeholder="영문+숫자 포함 8자 이상" minlength="8" pattern="(?=.*[A-Za-z])(?=.*\d).{8,}" required>
        </div>
        <div class="field">
          <label>새 비밀번호 확인</label>
          <input type="password" name="pw2" placeholder="다시 입력" minlength="8" required>
        </div>
        <div class="err" id="err">비밀번호가 일치하지 않습니다.</div>
        <button class="primary" type="submit">비밀번호 변경</button>
      </form>
    </div>

    <div class="ok" id="ok">
      <div class="check">✓</div>
      <h1>변경 완료</h1>
      <p>비밀번호가 변경되었습니다.<br>새 비밀번호로 로그인하세요.</p>
      <button class="primary" onclick="location.href='index.html'">로그인하러 가기</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sbR=window.supabase.createClient('https://lkbbenyvchddsjsihofv.supabase.co','sb_publishable_sMTkTGD-1CktZQqirrjk6Q_0mxgpRG_');
(async function(){
  // 이메일 링크의 복구 토큰이 세션으로 잡혀야 변경 가능
  await new Promise(function(r){ setTimeout(r,600); });
  var s=(await sbR.auth.getSession()).data.session;
  if(!s){ var err=document.getElementById('err'); err.textContent='재설정 링크가 만료되었거나 잘못되었습니다. 비밀번호 찾기에서 다시 요청해 주세요.'; err.classList.add('on'); }
})();
async function resetPw(e){
  e.preventDefault();
  var d=new FormData(e.target), pw=d.get('pw'), pw2=d.get('pw2');
  var err=document.getElementById('err');
  if(!/^(?=.*[A-Za-z])(?=.*\d).{8,72}$/.test(pw)){ err.textContent='비밀번호는 영문과 숫자를 모두 포함해 8자 이상이어야 합니다.'; err.classList.add('on'); return false; }
  if(pw!==pw2){ err.textContent='비밀번호가 일치하지 않습니다.'; err.classList.add('on'); return false; }
  err.classList.remove('on');
  var r=await sbR.auth.updateUser({password:pw});
  if(r.error){ err.textContent='변경 실패: '+r.error.message; err.classList.add('on'); return false; }
  await sbR.auth.signOut();
  document.getElementById('form').classList.add('off');
  document.getElementById('ok').classList.add('on');
  return false;
}
</script>
</body>
</html>
