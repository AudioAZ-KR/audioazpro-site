<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>플러그인 활성화 — AudioAZ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
@font-face{font-family:'NanumSquareRound';src:url('fonts/NanumSquareRoundEB.woff2') format('woff2');font-weight:800;font-display:swap}
.brand b,h1{font-family:'NanumSquareRound','Pretendard',sans-serif}
:root{--blue:#1877F2;--blue-deep:#0E5FCC;--blue-soft:#4D96F5;--navy:#0C2244;--navy-deep:#081729;--line:#22344F;--dim:#9DB0C9;--text:#E8EEF7;--card:#111F37;--sky:#16263F}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;background:#0A1424;color:var(--text);line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
a{color:inherit;text-decoration:none}svg{max-width:100%}

/* 플러그인 창처럼 보이는 패널 */
.win{width:100%;max-width:460px;background:linear-gradient(180deg,#0E1E36,#0B1728);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;background:#0C1B31;border-bottom:1px solid var(--line)}
.bar .dot{width:11px;height:11px;border-radius:50%}
.bar .r{background:#FF5F57}.bar .y{background:#FEBC2E}.bar .g{background:#28C840}
.bar .t{margin-left:8px;font-size:12px;color:var(--dim);letter-spacing:.02em}
.body{padding:24px 24px 26px}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:18px}
.brand .logo{width:26px;flex:none}
.brand b{font-size:15px;color:#fff}
.ey{font-size:11.5px;font-weight:800;letter-spacing:.12em;color:var(--blue-soft);text-transform:uppercase}
h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.psub{font-size:13px;color:var(--dim);margin-bottom:18px}
.lab{font-size:11.5px;font-weight:800;color:var(--dim);letter-spacing:.02em;margin-bottom:6px;display:block}
.key{width:100%;background:#0A1526;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-family:ui-monospace,Menlo,monospace;font-size:13px;color:#fff;letter-spacing:.02em}
.key:focus{outline:none;border-color:var(--blue)}

/* 저장 위치 선택 */
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 6px}
.opt{position:relative;border:1.5px solid var(--line);border-radius:12px;padding:14px 13px;cursor:pointer;transition:.15s;background:#0B1930}
.opt:hover{border-color:var(--blue-soft)}
.opt.sel{border-color:var(--blue);background:var(--sky);box-shadow:0 0 0 3px rgba(24,119,242,.18)}
.opt .num{font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:700;color:var(--blue-soft);letter-spacing:.05em}
.opt h3{font-size:14.5px;font-weight:800;margin:8px 0 3px;color:#fff}
.opt p{font-size:11.5px;color:var(--dim);line-height:1.5}
.opt input{position:absolute;opacity:0;pointer-events:none}
.usbrow{display:none;margin-top:12px;background:#0A1526;border:1px dashed var(--line);border-radius:10px;padding:11px 13px;font-size:12px;color:var(--dim)}
.usbrow.on{display:block}
.usbrow b{color:#fff;font-family:ui-monospace,Menlo,monospace;font-weight:700}
.go{width:100%;height:48px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-family:inherit;font-size:15.5px;font-weight:800;cursor:pointer;margin-top:16px;transition:.15s}
.go:hover{background:var(--blue-deep)}
.note{font-size:11.5px;color:var(--dim);margin-top:14px;line-height:1.6;text-align:center}
.demo{display:inline-block;font-size:10px;font-weight:800;color:#B26A00;background:#F5B93C;border-radius:6px;padding:2px 7px;vertical-align:middle;margin-left:6px}
</style>
</head>
<body>
<div class="win">
  <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="t" id="winTitle">Klera Voice — 활성화</span></div>
  <div class="body">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 488 555" xmlns="http://www.w3.org/2000/svg" aria-label="AudioAZ"><path fill-rule="evenodd" fill="#1877F2" d="M253.775,3.7c35.4,20.454,189.736,109.832,224.059,129.667,4.513,3.12,8.1,5.232,8.943,14.67V403.9c-0.124,9.828-2.857,15.714-11.177,21.1L257.279,551.157c-9.93,5.253-17.835,3.82-26.213-.173L10.569,423.826C4.8,420.583,1.232,416.2,1.4,405.93V145.424a10.362,10.362,0,0,1,5.465-9.569C35.827,119.092,199.631,23.884,235.89,3.207,240.774,0.837,246.235.7,253.775,3.7Z"/><path fill-rule="evenodd" fill="#fff" d="M263.66,284.057L450.08,172.72c2.179-1.135,6.723-.414,6.392,5.363,0,16.067.024,49.176,0.024,49.176l-120.92,188.2L448.93,347.909c2.1-1.3,6.31-2.767,6.559,3.1v40.522c0.1,5.507-.528,9.513-8.007,15.6C415.2,426.36,294.793,498.045,263.214,516.905c-7.665,3.5-8.614-.994-8.446-3.975,0-15.933.194-49.167,0.194-49.167L376.89,274.56,262.578,342.109c-5.706,2.288-6.608-2-6.608-4.261V298.237C255.97,292.418,255.277,288.533,263.66,284.057Z"/></svg></span>
      <b>AudioAZ</b>
    </div>

    <div class="ey">License Activation</div>
    <h1 id="pName">Klera Voice<span class="demo">데모</span></h1>
    <p class="psub">라이선스 키를 확인하고 <b>저장 위치</b>를 선택해 활성화하세요. 실제 플러그인 안에서 보이는 화면입니다.</p>

    <label class="lab">라이선스 키</label>
    <input class="key" id="key" spellcheck="false" value="">

    <label class="lab" style="margin-top:16px">라이선스 저장 위치</label>
    <div class="choice">
      <label class="opt sel" id="optMachine" onclick="pick('machine')">
        <input type="radio" name="loc" value="machine" checked>
        <div class="num">01</div>
        <h3>이 컴퓨터</h3>
        <p>이 기기에 저장. USB 없이 바로 사용. (기본 2대까지)</p>
      </label>
      <label class="opt" id="optUsb" onclick="pick('usb')">
        <input type="radio" name="loc" value="usb">
        <div class="num">02</div>
        <h3>USB 드라이브</h3>
        <p>USB에 저장. 꽂은 어느 컴퓨터에서든 사용.</p>
      </label>
    </div>
    <div class="usbrow" id="usbrow">활성화할 USB: <b id="usbName">감지된 USB 없음 (데모에서는 자동 지정)</b><br>이 USB의 볼륨 ID에 묶여, 다른 USB로 복사해도 동작하지 않습니다.</div>

    <button class="go" id="goBtn" onclick="activate()">이 컴퓨터에 활성화</button>
    <p class="note">활성화 방식은 나중에 <a href="account.html" style="color:var(--blue-soft);font-weight:700">내 계정</a>에서 변경할 수 있습니다.</p>
  </div>
</div>

<script src="az-demo.js"></script>
<script>
if(!AZ.session()){ location.href='index.html'; }
var CUR='KV', LOC='machine';
(function(){
  var qp=new URLSearchParams(location.search);
  var p=(qp.get('p')||'KV').toUpperCase();
  var m=AZ.PRODMETA[p];
  if(m){ CUR=p;
    document.getElementById('pName').innerHTML=m.name+'<span class="demo">데모</span>';
    document.getElementById('winTitle').textContent=m.name+' — 활성화';
  }
  var lic=AZ.licenseFor(CUR);
  document.getElementById('key').value = lic ? lic.key : (AZ.hasLicense(CUR)?'':'라이선스가 없습니다 — 결제 페이지에서 발급');
})();
function pick(loc){
  LOC=loc;
  document.getElementById('optMachine').classList.toggle('sel',loc==='machine');
  document.getElementById('optUsb').classList.toggle('sel',loc==='usb');
  document.getElementById('usbrow').classList.toggle('on',loc==='usb');
  document.getElementById('goBtn').textContent = (loc==='usb') ? 'USB에 활성화' : '이 컴퓨터에 활성화';
}
function activate(){
  var lic=AZ.licenseFor(CUR);
  if(!lic){ alert('먼저 라이선스를 발급받아야 합니다.\n결제 페이지에서 구매하거나 프로모션 코드를 입력하세요.'); location.href='checkout.html?p='+CUR; return; }
  AZ.setBinding(CUR, LOC);
  var b=AZ.bindingLabel(AZ.licenseFor(CUR).binding);
  alert('활성화 완료 (테스트)\n\n'+AZ.PRODMETA[CUR].name+'\n저장 위치: '+b.name+' ('+b.id+')\n\n'+b.hint+'.\n(정식 전환 시: 플러그인이 실제 기기 UUID / USB 볼륨ID를 읽어 서버가 서명)');
  location.href='account.html';
}
</script>
</body>
</html>
