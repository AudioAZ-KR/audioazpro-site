<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>문의 — AudioAZ</title><meta name="description" content="AudioAZ 문의 — 설치·라이선스·결제·출시 알림 등 문의하기.">
<link rel="canonical" href="https://audioazpro.com/contact.html">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
@font-face{font-family:'NanumSquareRound';src:url('fonts/NanumSquareRoundEB.woff2') format('woff2');font-weight:800;font-display:swap}
h1,h2{font-family:'NanumSquareRound','Pretendard',sans-serif}
:root{--blue:#1877F2;--blue-deep:#0E5FCC;--blue-soft:#4D96F5;--page:#0B1220;--card:#121D33;--bg:#0C1424;--line:#243350;--text:#E9EEF7;--dim:#96A6BF;--navbg:rgba(11,18,32,.9);--green:#12B76A}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}img{max-width:100%}
nav{position:sticky;top:0;z-index:50;background:var(--navbg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:10px;height:64px;max-width:1040px;margin:0 auto;padding:0 24px}
.menu{margin-left:auto;display:flex;gap:22px;font-size:14.5px;font-weight:600;color:var(--dim)}.menu a:hover{color:var(--blue-soft)}
.wrap{max-width:640px;margin:0 auto;padding:0 24px}
.head{padding:46px 0 6px}.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.14em;color:var(--blue-soft);text-transform:uppercase}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:8px 0 4px}.sub{color:var(--dim);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;margin:22px 0 40px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--dim);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-family:inherit;font-size:15px;color:var(--text);background:#0E1A2E}
.field input::placeholder,.field textarea::placeholder{color:#6B7C96}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,119,242,.18)}
.field textarea{min-height:150px;resize:vertical;line-height:1.6}
.filebox{border:1px dashed var(--line);border-radius:11px;padding:14px;background:#0E1A2E;font-size:13.5px;color:var(--dim)}
.filebox input{padding:0;border:0;background:none;color:var(--text);font-size:13.5px}
.filelist{margin-top:8px;font-size:12.5px;color:var(--blue-soft)}
.consent{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--dim);margin:4px 0 18px}
.consent input{width:auto;margin-top:2px}
.consent a{color:var(--blue-soft);font-weight:600}
.primary{width:100%;height:50px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-family:inherit;font-size:15.5px;font-weight:800;cursor:pointer;transition:.15s}
.primary:hover{background:var(--blue-deep)}
.primary:disabled{opacity:.5;cursor:not-allowed}
.err{color:#ff9ea3;font-size:12.5px;margin:-8px 0 12px;display:none}.err.on{display:block}
.note{font-size:12px;color:var(--dim);margin-top:14px;line-height:1.6}
.ok{display:none;text-align:center;padding:10px 0}
.ok.on{display:block}.form.off{display:none}
.ok .check{width:60px;height:60px;border-radius:50%;background:#12351f;border:1px solid #1f5c37;color:#7ee0a6;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 16px}
.ok p{color:var(--dim);font-size:14.5px;margin-bottom:20px;line-height:1.7}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue-soft);outline-offset:2px}
footer{border-top:1px solid var(--line);color:var(--dim);padding:26px 0;font-size:13px;margin-top:10px}
footer .wrap{max-width:1040px;display:flex;gap:14px;flex-wrap:wrap}footer .right{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap}footer a:hover{color:#fff}
</style>
</head>
<body>
<nav><div class="nav-in">
  <a href="/" class="logo" aria-label="AudioAZ 홈"><img src="/assets/logo-lockup-white.png" alt="AudioAZ" style="height:30px;width:auto;display:block"></a>
  <div class="menu"><a href="products.html">제품</a><a href="downloads.html">다운로드</a><a href="support.html">지원</a></div>
</div></nav>

<div class="wrap head"><div class="eyebrow">Contact</div><h1>문의하기</h1><p class="sub">설치·라이선스·결제·출시 알림 등 무엇이든 남겨주세요.</p></div>

<div class="wrap">
  <div class="card">
    <div class="form" id="form">
      <form onsubmit="return submitContact(event)" enctype="multipart/form-data">
        <input type="hidden" name="access_key" value="93017b6f-c3fc-4a0e-9fbd-4f05ec4fe9ea">
        <input type="hidden" name="from_name" value="AudioAZ 문의">
        <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">
        <div class="field">
          <label for="c-type">문의 유형</label>
          <select id="c-type" name="type">
            <option value="설치·사용">설치·사용</option>
            <option value="라이선스·활성화">라이선스·활성화</option>
            <option value="결제·환불">결제·환불</option>
            <option value="출시 알림">출시 알림 신청</option>
            <option value="제휴·기타">제휴·기타</option>
          </select>
        </div>
        <div class="field">
          <label for="c-email">회신 이메일</label>
          <input id="c-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="c-subject">제목</label>
          <input id="c-subject" name="subject" type="text" placeholder="제목을 입력하세요" required>
        </div>
        <div class="field">
          <label for="c-body">내용</label>
          <textarea id="c-body" name="message" placeholder="문의 내용을 자세히 적어주세요. (사용 DAW·OS·제품 버전 등을 함께 알려주시면 빠르게 도와드릴 수 있습니다.)" required></textarea>
        </div>
        <div class="field">
          <label for="c-files">첨부파일 <span style="font-weight:500;color:var(--dim)">(선택 · PDF·PNG·JPEG · 5MB 이하 1개)</span></label>
          <div class="filebox"><input id="c-files" name="attachment" type="file" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg" onchange="showFiles(this)"><div class="filelist" id="filelist"></div></div>
        </div>
        <label class="consent"><input type="checkbox" id="c-consent" required> <span>문의 처리를 위해 이메일 및 입력 정보 수집에 동의합니다. <a href="privacy.html">개인정보처리방침</a></span></label>
        <div class="err" id="err" role="alert">필수 항목을 확인하고 동의에 체크해 주세요.</div>
        <button class="primary" type="submit">보내기</button>
      </form>
      <p class="note">문의는 이메일로 접수됩니다(첨부파일 지원). 급하시면 <a href="mailto:support@audioazpro.com" style="color:var(--blue-soft)">support@audioazpro.com</a> 으로도 문의하실 수 있습니다.</p>
    </div>

    <div class="ok" id="ok">
      <div class="check">✓</div>
      <h1>접수되었습니다</h1>
      <p id="okmsg">문의가 접수되었습니다.<br>회신 이메일로 답변드리겠습니다.</p>
      <button class="primary" onclick="location.href='/'">홈으로</button>
    </div>
  </div>
</div>

<footer><div class="wrap"><span>© AudioAZ (오디오에이지)</span><span class="right"><a href="products.html">제품</a> · <a href="support.html">지원</a> · <a href="privacy.html">개인정보처리방침</a> · <a href="terms.html">이용약관</a> · <a href="refund.html">환불·라이선스</a></span></div></footer>

<script>
(function(){var t=new URLSearchParams(location.search).get('type');if(t){var s=document.getElementById('c-type');for(var i=0;i<s.options.length;i++){if(s.options[i].value===t||s.options[i].value.indexOf(t)>-1){s.selectedIndex=i;break;}}var p=new URLSearchParams(location.search).get('p');if(p&&t.indexOf('출시')>-1){document.getElementById('c-subject').value='['+p+'] 출시 알림 신청';}}})();
function showFiles(inp){
  var allow=/\.(pdf|png|jpe?g)$/i, el=document.getElementById('filelist'), err=document.getElementById('err');
  var f=inp.files[0]; if(!f){ el.textContent=''; return; }
  if(!allow.test(f.name)){ inp.value=''; el.textContent=''; err.textContent='PDF·PNG·JPEG 파일만 첨부할 수 있습니다.'; err.classList.add('on'); return; }
  if(f.size > 5*1024*1024){ inp.value=''; el.textContent=''; err.textContent='첨부파일은 5MB 이하만 가능합니다.'; err.classList.add('on'); return; }
  err.classList.remove('on');
  el.textContent='첨부: '+f.name+' ('+Math.round(f.size/1024)+'KB)';
}
async function submitContact(e){
  e.preventDefault();
  var form=e.target, err=document.getElementById('err');
  var consent=document.getElementById('c-consent').checked;
  if(!form.checkValidity() || !consent){ err.textContent='필수 항목을 확인하고 개인정보 수집에 동의해 주세요.'; err.classList.add('on'); return false; }
  var key=(form.access_key&&form.access_key.value)||'';
  if(!key || key.indexOf('YOUR_')===0){ err.textContent='문의 폼이 아직 설정 중입니다. support@audioazpro.com 으로 보내주세요.'; err.classList.add('on'); return false; }
  err.classList.remove('on');
  var btn=form.querySelector('button[type=submit]'), old=btn.textContent; btn.disabled=true; btn.textContent='전송 중…';
  var email=document.getElementById('c-email').value;
  try{
    var fd=new FormData(form);
    fd.set('replyto', email);
    fd.set('subject', (document.getElementById('c-subject').value||'AudioAZ 문의'));
    var r=await fetch('https://api.web3forms.com/submit',{method:'POST',body:fd});
    var j=await r.json();
    if(j && j.success){
      document.getElementById('okmsg').innerHTML='문의가 접수되었습니다.<br><b>'+email+'</b> 로 답변드리겠습니다.';
      document.getElementById('form').classList.add('off');
      document.getElementById('ok').classList.add('on');
      window.scrollTo(0,0);
    } else { throw new Error((j&&j.message)||'전송 실패'); }
  }catch(ex){
    err.textContent='전송에 실패했습니다. 잠시 후 다시 시도하거나 support@audioazpro.com 으로 보내주세요.';
    err.classList.add('on'); btn.disabled=false; btn.textContent=old;
  }
  return false;
}
</script>
</body>
</html>
