a.scard:hover .go{color:var(--blue-soft)}

:root{--page:#0B1220;--card:#121D33;--navbg:rgba(11,18,32,.9);--text:#E9EEF7;--dim:#96A6BF;--line:#243350;--bg:#0C1424;--sky:#17273F;--wordmark:#ffffff}.navtoggle{display:none;margin-left:auto;background:none;border:0;color:var(--text);cursor:pointer;padding:6px;line-height:0}@media(max-width:760px){.navtoggle{display:block}.nav-in .menu{position:absolute;top:64px;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;background:#0B1220;z-index:60;box-shadow:0 18px 44px rgba(0,0,0,.6);border-bottom:1px solid var(--line);padding:8px 24px 18px;margin-left:0;display:none}.nav-in .menu.open{display:flex}.nav-in .menu .hide-sm{display:block}.nav-in .menu a{padding:13px 2px;border-bottom:1px solid var(--line);font-size:15px}.nav-in .menu .login{background:var(--blue);color:#fff;border:1px solid var(--blue);border-radius:10px;padding:12px;text-align:center;margin-top:10px}}.scard.klera{background:radial-gradient(130% 100% at 0% 0%,rgba(109,75,240,.16),transparent 58%),var(--card)}a.scard.klera:hover{border-color:var(--klera);box-shadow:0 14px 36px rgba(109,75,240,.24)}.scard.flare{background:radial-gradient(120% 100% at 100% 0%,rgba(229,51,63,.15),transparent 55%),radial-gradient(120% 110% at 0% 100%,rgba(18,183,106,.12),transparent 55%),var(--card)}a.scard.flare:hover{border-color:var(--flare);box-shadow:0 14px 36px rgba(229,51,63,.24)}</style>

<script>
(function(){
  var W=function(v){return '₩'+Number(v||0).toLocaleString();};
  var THEME={KV:'klera',KI:'klera',TALLY:'flare',LMAZ:'flare'};
  var TAG={KV:'KLERA · VOICE',KI:'KLERA · INSTRUMENT',TALLY:'FLARE · TALLY',LMAZ:'LATENCY METER'};
  var grid=document.getElementById('saleGrid'), empty=document.getElementById('saleEmpty');
  var today=AZ.today();
  var sales=AZ.sales(), keys=Object.keys(sales).filter(function(k){
    var s=sales[k];
    return (!s.start||today>=s.start)&&(!s.end||today<=s.end)&&AZ.PRODMETA[k];
  });
  if(!keys.length){ empty.style.display='block'; return; }
  grid.innerHTML=keys.map(function(k){
    var m=AZ.PRODMETA[k], s=sales[k], base=m.price||0;
    var pct=base?Math.round((base-s.price)/base*100):0;
    var period=(s.start||s.end)?((s.start||'')+' ~ '+(s.end||'해제 시까지')):'상시 진행 중';
    return '<a class="scard '+(THEME[k]||'klera')+'" href="portal/checkout.html?p='+k+'"><span class="accent"></span>'+
      '<div class="tag">'+(TAG[k]||k)+'</div>'+
      '<h3>'+m.name+'<span class="offbadge">'+pct+'% OFF</span></h3>'+
      '<p>'+m.desc+'</p>'+
      '<div class="pricebox"><span class="was">'+W(base)+'</span><span class="now">'+W(s.price)+'</span></div>'+
      '<div class="period">할인 기간: '+period+'</div>'+
      '<span class="go">할인가로 구매하기 →</span>'+
    '</a>';
  }).join('');
})();
(function(){var t=document.querySelector(".navtoggle"),m=document.querySelector(".nav-in .menu");if(!t||!m)return;t.addEventListener("click",function(){var o=m.classList.toggle("open");t.setAttribute("aria-expanded",o?"true":"false")});m.addEventListener("click",function(e){if(e.target.closest("a")){m.classList.remove("open");t.setAttribute("aria-expanded","false")}});document.addEventListener("keydown",function(e){if(e.key==="Escape"){m.classList.remove("open");t.setAttribute("aria-expanded","false")}});})();
</script>
